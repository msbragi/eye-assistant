<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GemmaLink Eye Assistant</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link href="css/eye.css?v=1.0.0" rel="stylesheet">
</head>

<body data-state="ask" class="mode-text">
    <div id="boot-overlay" class="loading">
        <div class="boot-loader">
            <div class="spinner"></div>
            <p>Connecting Gemma Server...</p>
        </div>
        <div class="boot-error">
            <h3>⚠️ Server Not Ready</h3>
            <p>The server is offline or the AI model has not been started.</p>
            <button onclick="window.location.reload()" class="btn-retry">Retry</button>
        </div>
    </div>

    <div id="mode-selector" class="mode-selector">
        <button id="btn-mode-vision" class="mode-btn" onclick="switchMode('vision')">📸 Vision</button>
        <button id="btn-mode-text" class="mode-btn" onclick="switchMode('text')">✍️ Text Only</button>
    </div>

    <main class="ui-container">
        <div id="camera-layer">
            <video id="video" playsinline muted></video>
            <div class="finder-overlay" id="finder"></div>
        </div>

        <img id="snapshot" alt="snapshot" />

        <div class="state-preview">
            <button class="fab-capture" id="btn-capture"></button>
        </div>

        <div class="state-ask">
            <div class="interaction-sheet">
                <div class="presets-container">
                    <div class="chip" data-q="What are these controls?">Appliance</div>
                    <div class="chip" data-q="Summarise this document.">Document</div>
                    <div class="chip" data-q="What does this label mean?">Label</div>
                    <div class="chip" data-q="Step by step instructions for this.">Manual</div>
                </div>
                <textarea id="question" rows="4" placeholder="Ask Gemma anything..."></textarea>
                <div class="btn-group" style="padding:0;">
                    <button class="btn btn-secondary" id="btn-retake" style="display:none;">Retake</button>
                    <button class="btn btn-primary" id="btn-ask">Ask Gemma</button>
                </div>
            </div>
        </div>

        <div class="state-response">
            <div class="response-panel">
                <div class="loader-bar" id="loader"></div>
                <div class="response-content" id="answer-box"></div>
                <div class="btn-group">
                    <button class="btn btn-secondary" id="btn-stop">Stop</button>
                    <button class="btn btn-primary" id="btn-new" disabled>New Question</button>
                </div>
            </div>
        </div>
    </main>
    <script src="js/eye.js?v=1.0.0"></script>
</body>
</html>
