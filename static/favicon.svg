<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c63ff"/>
      <stop offset="100%" style="stop-color:#3ecfcf"/>
    </linearGradient>
    <linearGradient id="pupil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Eye shape -->
  <path d="M5 16 C8 10, 14 8, 16 8 C18 8, 24 10, 27 16 C24 22, 18 24, 16 24 C14 24, 8 22, 5 16 Z"
        fill="white" opacity="0.95"/>
  <!-- Iris -->
  <circle cx="16" cy="16" r="5.5" fill="url(#pupil)"/>
  <!-- Pupil highlight -->
  <circle cx="16" cy="16" r="3" fill="#6c63ff"/>
  <!-- Shine -->
  <circle cx="18" cy="14" r="1.2" fill="white" opacity="0.8"/>
</svg>
